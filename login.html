<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SanketRisk Home — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    /* Residential theme — warm forest green + terracotta, distinct from
       Commercial's navy/gold. Deliberately keeping the SAME variable
       names as the Commercial codebase (--navy, --gold, etc.) rather than
       renaming to --primary/--accent — app.html and the other files we'll
       adapt from Commercial reference these names directly in dozens of
       places, so keeping the names and just changing the values is far
       safer than hunting down every var(--navy) to rename. This block is
       the only thing that needs to change to re-brand the whole platform
       later (e.g. for a future licensee) — values only, names stay fixed. */
    --navy:       #2d3b2e;
    --navy-mid:   #3d4f3f;
    --navy-light: #526b55;
    --gold:       #c17a56;
    --gold-light: #d99b7a;
    --gold-pale:  #f3e2d6;
    --slate:      #6b5d52;
    --slate-light:#a69686;
    --border:     #ddd2c4;
    --bg:         #f7f4ef;
    --card-bg:    #ffffff;
  }
  html, body { height: 100%; font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--navy); }
  body { display: flex; align-items: center; justify-content: center; }
  .login-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 40px 36px; width: 100%; max-width: 380px; box-shadow: 0 8px 32px rgba(45,59,46,.08); }
  .brand-icon { width: 44px; height: 44px; background: var(--gold); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 16px; }
  .brand-title { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: var(--navy); }
  .brand-title span { color: var(--gold); }
  .form-sub { font-size: 13px; color: var(--slate); margin-top: 4px; margin-bottom: 28px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--slate); margin-bottom: 6px; }
  .field input { width: 100%; padding: 11px 13px; border: 1px solid var(--border); border-radius: 7px; font-size: 14px; font-family: inherit; background: var(--bg); color: var(--navy); }
  .field input:focus { outline: none; border-color: var(--gold); }
  .btn-signin { width: 100%; padding: 12px; background: var(--navy); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 8px; transition: background .2s; }
  .btn-signin:hover { background: var(--navy-mid); }
  .btn-signin:disabled { opacity: .6; cursor: not-allowed; }
  .error-msg { font-size: 12.5px; color: #c0392b; margin-top: 14px; display: none; }
</style>
</head>
<body>
  <div class="login-card">
    <div class="brand-icon">🏠</div>
    <div class="brand-title">SanketRisk <span>Home</span></div>
    <div class="form-sub">Sign in to your SanketRisk Home account</div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="login-email" autocomplete="username" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button class="btn-signin" id="btn-signin" onclick="doSignIn()">Sign In</button>
    <div class="error-msg" id="error-msg"></div>
  </div>

<script>
  // NOTE: replace with your new Residential Supabase project's own URL and
  // anon (public) key — found under Project Settings → API in Supabase.
  const SUPABASE_URL = 'https://lkihphmtyusqmnhbfswq.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_X7JifOrQKvkCwGD7DQpPZg_-6jB5j3Z';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function doSignIn() {
    var email = document.getElementById('login-email').value.trim();
    var password = document.getElementById('login-password').value;
    var errEl = document.getElementById('error-msg');
    var btn = document.getElementById('btn-signin');
    errEl.style.display = 'none';
    if (!email || !password) { errEl.textContent = 'Please enter both email and password.'; errEl.style.display = 'block'; return; }
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      const { error } = await _supabase.auth.signInWithPassword({ email: email, password: password });
      if (error) throw error;
      window.location.replace('/dashboard.html');
    } catch (e) {
      errEl.textContent = e.message || 'Sign in failed — please check your email and password.';
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  }

  // If already signed in, skip straight to the dashboard
  (async function checkExistingSession() {
    const { data: { session } } = await _supabase.auth.getSession();
    if (session) window.location.replace('/dashboard.html');
  })();

  document.getElementById('login-password').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doSignIn();
  });
</script>
</body>
</html>
