<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>e2Value test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:system-ui;margin:16px;max-width:900px}button{padding:10px 14px;margin:4px 4px 4px 0}pre{background:#f3f3f0;padding:10px;overflow:auto;white-space:pre-wrap;word-break:break-all}</style></head>
<body><h2>e2Value Ballpark Residential — test call</h2>
<p>Sign in on the dashboard first, then type this page's address into the browser (your site address followed by /valuation-test.html). It sends e2Value's own sample property.</p>
<button onclick="run(false)">Send (with namespace)</button><button onclick="run(true)">Send (no namespace)</button>
<div id="pdf"></div><pre id="out">Ready.</pre>
<script>
const LAMBDA_URL = 'https://vw7ib6ondyhngfsioxiactk5ty0rnfmg.lambda-url.ap-southeast-2.on.aws/';
const _s = supabase.createClient('https://lkihphmtyusqmnhbfswq.supabase.co','sb_publishable_X7JifOrQKvkCwGD7DQpPZg_-6jB5j3Z');
const est = {property:{address1:'111 Test Street',address2:'',city:'Ottawa',province:'Ontario',postalcode:'K2P 1L7',locale:'beachfront',coverage_a:250000,
architectural_style:'Brownstone',construction_quality:'average / standard',physical_shape:'complicated',construction_type:'framing, steel',recent_renovations:'no',historic_registry:'no',
primary_exterior:'brick masonry',primary_roof_covering:'architectural shingle',
living_area:{year_built:1990,square_footage:1000},other_areas:{area:[{area_name:'breeze way',year_built:1990,square_footage:100}]},
unique_items:{item:[{item_name:'gargoyle',cost:'500.00'}]},replacement_cost_type:'full',
return_acv:{_attr:{value:'yes'},structure_in_use:'yes',condition:{general:'good',roof:'good',wall:'good',foundation:'good'}}}};
async function run(noNs){
 const o=document.getElementById('out'); o.textContent='Sending…'; document.getElementById('pdf').innerHTML='';
 try{
  const {data:{session}}=await _s.auth.getSession(); if(!session){o.textContent='Not signed in — log in on the dashboard first.';return;}
  const r=await fetch(LAMBDA_URL,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({estimate:est,noNamespace:noNs,debug:true})});
  const txt=await r.text(); let j; try{j=JSON.parse(txt);}catch(e){o.textContent='HTTP '+r.status+' '+r.statusText+'\nHeaders: content-type='+r.headers.get('content-type')+'\nRaw reply ('+txt.length+' chars):\n'+txt.slice(0,2000);return;} const show={...j}; if(show.base64){show.base64='[PDF '+show.base64.length+' chars]';}
  o.textContent=JSON.stringify(show,null,2);
  if(j.base64){const a=document.createElement('a');a.href='data:application/pdf;base64,'+j.base64;a.download='e2value-test.pdf';a.textContent='Download PDF';document.getElementById('pdf').appendChild(a);}
 }catch(e){o.textContent='Error: '+e.message;}
}
</script></body></html>
